name: masterhand

services:
  masterhand:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args:
        CLOUDFLARED_VERSION: ${CLOUDFLARED_VERSION:-2026.9.3}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      OPENCODE_URL: http://opencode:4096
      DATA_DIR: /data
      WEB_DIST: apps/web/dist
      # Every workspace is a subfolder created here (same path opencode sees).
      WORKSPACES_ROOT: /workspace
      # Per-session git worktrees; inside the shared mount so opencode sees them.
      WORKTREES_ROOT: /workspace/.worktrees
      # Live previews: the tunnel targets the dev server inside the opencode
      # container. Quick tunnels need outbound Internet access.
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_ORIGIN: opencode
      PREVIEW_PORT_RANGE: ${PREVIEW_PORT_RANGE:-3200-3299}
    volumes:
      - masterhand_data:/data
      # Shared with opencode: the BFF creates each workspace subfolder here.
      - ${WORKSPACES_DIR:-../workspace}:/workspace
    ports:
      # Bind to 127.0.0.1 when your reverse proxy runs on the host.
      - "${MASTERHAND_BIND:-0.0.0.0}:${MASTERHAND_PORT:-8787}:8787"
    networks:
      - internal
    depends_on:
      - opencode

  opencode:
    build:
      context: .
      dockerfile: opencode.Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.0.6}
    restart: unless-stopped
    environment:
      # Only the opencode credentials are shared with this container; the BFF
      # secrets (MASTERHAND_PASSWORD, SESSION_SECRET) stay out of it.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set it in deploy/.env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      # Every agent shell command goes through the setuid dropper, so the shell
      # runs as `agent` (uid 1001) and never as the `node` user (uid 1000) that
      # runs the engine. Inline config wins over a workspace's opencode.json,
      # so a project cannot opt out. See ARCHITECTURE.md ADR-22.
      OPENCODE_CONFIG_CONTENT: '{"shell":"/usr/local/bin/agent-exec"}'
    volumes:
      - opencode_config:/home/node/.config/opencode
      - opencode_data:/home/node/.local/share/opencode
      - ${WORKSPACES_DIR:-../workspace}:/workspace
    working_dir: /workspace
    expose:
      - "4096"
    networks:
      - internal

networks:
  internal:

volumes:
  masterhand_data:
  opencode_config:
  opencode_data:
