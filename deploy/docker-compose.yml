name: masterhand

services:
  masterhand:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args:
        CLOUDFLARED_VERSION: ${CLOUDFLARED_VERSION:-2026.9.3}
    restart: unless-stopped
    # Bound container logs: a long agent turn can produce gigabytes, and the
    # host disk is shared with SQLite and the workspaces.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    # Protect neighboring processes from a runaway workload (an agent build can
    # otherwise OOM the host). Raise via deploy/.env when a build needs more.
    deploy:
      resources:
        limits:
          cpus: "${MASTERHAND_CPUS_LIMIT:-1}"
          memory: "${MASTERHAND_MEMORY_LIMIT:-1g}"
    env_file:
      - .env
    environment:
      PORT: "8787"
      OPENCODE_URL: http://opencode:4096
      DATA_DIR: /data
      WEB_DIST: apps/web/dist
      # Every workspace is a subfolder created here (same path opencode sees).
      WORKSPACES_ROOT: /workspace
      # Per-session git worktrees; inside the shared mount so opencode sees them.
      WORKTREES_ROOT: /workspace/.worktrees
      # Live previews: the tunnel targets the dev server inside the opencode
      # container. Quick tunnels need outbound Internet access.
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_ORIGIN: opencode
      PREVIEW_PORT_RANGE: ${PREVIEW_PORT_RANGE:-3200-3299}
      # MasterHand-owned custom-provider config, in opencode's global config dir
      # (shared volume below). opencode loads it with OPENCODE_CONFIG.
      OPENCODE_CUSTOM_PROVIDERS_FILE: /home/node/.config/opencode/masterhand-providers.json
    volumes:
      - masterhand_data:/data
      # Shared with opencode: the BFF creates each workspace subfolder here.
      - ${WORKSPACES_DIR:-../workspace}:/workspace
      # MasterHand writes custom OpenAI-compatible providers into opencode's
      # config dir so opencode picks them up without a restart.
      - opencode_config:/home/node/.config/opencode
    ports:
      # Bind to 127.0.0.1 when your reverse proxy runs on the host.
      - "${MASTERHAND_BIND:-0.0.0.0}:${MASTERHAND_PORT:-8787}:8787"
    networks:
      - internal
    depends_on:
      opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  opencode:
    build:
      context: .
      dockerfile: opencode.Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.0.6}
    restart: unless-stopped
    # Same log cap as the BFF: opencode and every agent shell write here.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    # Agent builds are the heaviest workload; the cap protects the BFF, SQLite
    # and the host. Raise it in deploy/.env for memory-hungry builds.
    deploy:
      resources:
        limits:
          cpus: "${OPENCODE_CPUS_LIMIT:-2}"
          memory: "${OPENCODE_MEMORY_LIMIT:-4g}"
    environment:
      # Only the opencode credentials are shared with this container; the BFF
      # secrets (MASTERHAND_PASSWORD, SESSION_SECRET) stay out of it.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set it in deploy/.env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      # Every agent shell command goes through the setuid dropper, so the shell
      # runs as `agent` (uid 1001) and never as the `node` user (uid 1000) that
      # runs the engine. Inline config wins over a workspace's opencode.json,
      # so a project cannot opt out. See ARCHITECTURE.md ADR-22.
      OPENCODE_CONFIG_CONTENT: '{"shell":"/usr/local/bin/agent-exec"}'
      # MasterHand-owned custom OpenAI-compatible providers . Loading it
      # explicitly keeps the user's own opencode.json(c) untouched and lets the
      # BFF add providers without a restart. See ARCHITECTURE.md ADR-30.
      OPENCODE_CONFIG: /home/node/.config/opencode/masterhand-providers.json
    volumes:
      - opencode_config:/home/node/.config/opencode
      - opencode_data:/home/node/.local/share/opencode
      - ${WORKSPACES_DIR:-../workspace}:/workspace
    working_dir: /workspace
    expose:
      - "4096"
    networks:
      - internal
    healthcheck:
      # `$$` escapes the compose interpolation so the shell inside the container
      # reads the env vars opencode was started with.
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"$${OPENCODE_SERVER_USERNAME:-opencode}:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/api/info || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  internal:

volumes:
  masterhand_data:
  opencode_config:
  opencode_data:
