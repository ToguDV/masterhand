name: masterhand

services:
  masterhand:
    # Published images (`ghcr.io/togudv/masterhand:<version>`) are pulled by
    # `docker compose pull`; the local `build:` stays for contributors working
    # from source (`up --build`). Pin `MASTERHAND_VERSION` in deploy/.env to
    # upgrade on purpose instead of floating on `latest` — see
    # docs/runbooks/deployment.md §Releases.
    image: ghcr.io/togudv/masterhand:${MASTERHAND_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
      args:
        CLOUDFLARED_VERSION: ${CLOUDFLARED_VERSION:-2026.9.3}
        MASTERHAND_VERSION: ${MASTERHAND_VERSION:-0.2.0}
        MASTERHAND_BUILD: ${MASTERHAND_BUILD:-dev}
    restart: unless-stopped
    # Bound container logs: a long agent turn can produce gigabytes, and the
    # host disk is shared with SQLite and the workspaces.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    # Protect neighboring processes from a runaway workload (an agent build can
    # otherwise OOM the host). Raise via deploy/.env when a build needs more.
    deploy:
      resources:
        limits:
          cpus: "${MASTERHAND_CPUS_LIMIT:-1}"
          memory: "${MASTERHAND_MEMORY_LIMIT:-1g}"
    env_file:
      - .env
    environment:
      PORT: "8787"
      OPENCODE_URL: http://opencode:4096
      DATA_DIR: /data
      WEB_DIST: apps/web/dist
      # Every workspace is a subfolder created here (same path opencode sees).
      WORKSPACES_ROOT: /workspace
      # Live previews: the tunnel targets the dev server inside the opencode
      # container. Quick tunnels need outbound Internet access.
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      PREVIEW_ORIGIN: opencode
      PREVIEW_PORT_RANGE: ${PREVIEW_PORT_RANGE:-3200-3299}
      # MasterHand-owned custom-provider config, in opencode's global config dir
      # (shared volume below). opencode loads it with OPENCODE_CONFIG.
      OPENCODE_CUSTOM_PROVIDERS_FILE: /home/node/.config/opencode/masterhand-providers.json
      # Setuid dropper that launches managed runs as the unprivileged `agent`
      # user. The path is resolved inside the opencode container, not here.
      MANAGED_RUN_LAUNCHER: /usr/local/bin/agent-exec
      # One-click self-updater (#134), opt-in. Empty URL/token keeps the v1
      # manual flow; the sidecar is enabled with the `updater` profile and both
      # values set in deploy/.env. The token never reaches clients.
      MASTERHAND_UPDATE_URL: ${MASTERHAND_UPDATE_URL:-}
      MASTERHAND_UPDATE_TOKEN: ${MASTERHAND_UPDATE_TOKEN:-}
      # Image tag this deployment tracks; one-click updates need `latest`.
      # Pinned deployments keep the copy-command flow in the UI.
      MASTERHAND_UPDATE_TRACK: ${MASTERHAND_VERSION:-latest}
    volumes:
      - masterhand_data:/data
      # Shared with opencode: the BFF creates each workspace subfolder here.
      - ${WORKSPACES_DIR:-../workspace}:/workspace
      # MasterHand writes custom OpenAI-compatible providers into opencode's
      # config dir so opencode picks them up without a restart.
      - opencode_config:/home/node/.config/opencode
    ports:
      # Bind to 127.0.0.1 when your reverse proxy runs on the host.
      - "${MASTERHAND_BIND:-0.0.0.0}:${MASTERHAND_PORT:-8787}:8787"
    networks:
      - internal
    depends_on:
      opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  opencode:
    build:
      context: .
      dockerfile: opencode.Dockerfile
      args:
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.0.6}
    restart: unless-stopped
    # Same log cap as the BFF: opencode and every agent shell write here.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"
    # Agent builds are the heaviest workload; the cap protects the BFF, SQLite
    # and the host. Raise it in deploy/.env for memory-hungry builds.
    deploy:
      resources:
        limits:
          cpus: "${OPENCODE_CPUS_LIMIT:-2}"
          memory: "${OPENCODE_MEMORY_LIMIT:-4g}"
    environment:
      # Only the opencode credentials are shared with this container; the BFF
      # secrets (MASTERHAND_PASSWORD, SESSION_SECRET) stay out of it.
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set it in deploy/.env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      # Every agent shell command goes through the setuid dropper, so the shell
      # runs as `agent` (uid 1001) and never as the `node` user (uid 1000) that
      # runs the engine. Inline config wins over a workspace's opencode.json,
      # so a project cannot opt out. See ARCHITECTURE.md ADR-22.
      OPENCODE_CONFIG_CONTENT: '{"shell":"/usr/local/bin/agent-exec"}'
      # MasterHand-owned custom OpenAI-compatible providers . Loading it
      # explicitly keeps the user's own opencode.json(c) untouched and lets the
      # BFF add providers without a restart. See ARCHITECTURE.md ADR-30.
      OPENCODE_CONFIG: /home/node/.config/opencode/masterhand-providers.json
      # Project-level config/plugin discovery is OFF: a workspace's
      # `.opencode/` dir or `opencode.json(c)` would otherwise load plugins,
      # tools, MCP servers, commands and instructions that execute as the
      # engine user (`node`, uid 1000) with access to the credential store
      # (#218, verified against the pinned 2.0.6: a marker plugin ran on
      # session creation; with this flag it never loads). Explicit config
      # (`OPENCODE_CONFIG`/`OPENCODE_CONFIG_CONTENT` above) still applies, so
      # the shell dropper and MasterHand-owned providers are unaffected. Note:
      # a workspace's own AGENTS.md is no longer auto-injected into the
      # context; the per-session `masterhand.workspace` instruction still pins
      # the agent to its directory, and files remain explicitly readable.
      OPENCODE_CONFIG_PROJECT_DISABLE: "true"
    volumes:
      - opencode_config:/home/node/.config/opencode
      - opencode_data:/home/node/.local/share/opencode
      - ${WORKSPACES_DIR:-../workspace}:/workspace
    working_dir: /workspace
    expose:
      - "4096"
    networks:
      - internal
    healthcheck:
      # `$$` escapes the compose interpolation so the shell inside the container
      # reads the env vars opencode was started with.
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u \"$${OPENCODE_SERVER_USERNAME:-opencode}:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/api/info || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Opt-in one-click BFF updater (#134). Start it with:
  #   docker compose --profile updater up -d
  # and set MASTERHAND_UPDATE_URL=http://updater:8080 plus a strong
  # MASTERHAND_UPDATE_TOKEN in deploy/.env. A pinned MASTERHAND_VERSION
  # disables one-click updates in the UI (the sidecar only tracks the same tag
  # the compose file uses, so a pin would never pull anything newer).
  #
  # The Docker socket is root-equivalent: this sidecar is the only consumer and
  # the BFF never sees it. It can pull/recreate exactly the `masterhand`
  # service; the deploy directory is mounted read-only for the compose file and
  # `.env`, and it has no published ports.
  updater:
    image: ghcr.io/togudv/masterhand-updater:${MASTERHAND_VERSION:-latest}
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${MASTERHAND_UPDATE_TOKEN:-}
      COMPOSE_FILE: /deploy/docker-compose.yml
      COMPOSE_ENV_FILE: /deploy/.env
      COMPOSE_PROJECT: masterhand
      TARGET_SERVICE: masterhand
      TARGET_TAG: ${MASTERHAND_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/deploy:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

networks:
  internal:

volumes:
  masterhand_data:
  opencode_config:
  opencode_data:
