<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0b" />
    <meta name="description" content="MasterHand — your opencode agents from any device" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>MasterHand</title>
    <script>
      // Resolve the theme + palette before first paint: stored choices, else system.
      (function () {
        try {
          var stored = localStorage.getItem("mh-theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          document.documentElement.setAttribute("data-theme", theme)
          var palette = localStorage.getItem("mh-palette")
          if (palette && /^[a-z0-9-]+$/.test(palette)) {
            // Unknown ids are ignored by the CSS and fall back to paper.
            document.documentElement.setAttribute("data-palette", palette)
          }
        } catch (error) {
          /* file:// or private mode: the CSS prefers-color-scheme still applies */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
