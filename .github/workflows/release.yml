# Release (#131): tag-triggered only (`v*`, e.g. `v0.2.0`). Builds the server
# image with the release identity baked in (`MASTERHAND_VERSION` = the tag
# without `v`, `MASTERHAND_BUILD` = the commit SHA), pushes it to GHCR as
# `:version` plus `:latest`, generates the `version.json` manifest the BFF's
# `GET /api/update` reads, and creates the GitHub release with that manifest
# attached. Deliberately separate from `ci.yml` (untouched): releases run on
# tags, CI on PRs and `main`.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, push and publish
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/togudv/masterhand
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive the release identity
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            MASTERHAND_VERSION=${{ steps.meta.outputs.version }}
            MASTERHAND_BUILD=${{ steps.meta.outputs.build }}

      - name: Generate version.json
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="$(git tag -l --format='%(contents:subject)' "$TAG" | head -c 500)"
          VERSION="${{ steps.meta.outputs.version }}" DATE="${{ steps.meta.outputs.date }}" NOTES="$NOTES" node -e '
            const fs = require("node:fs");
            const notes = (process.env.NOTES ?? "").trim();
            const manifest = {
              version: process.env.VERSION,
              tag: process.env.TAG,
              publishedAt: process.env.DATE,
              notes: notes === "" ? null : notes,
            };
            fs.writeFileSync("version.json", JSON.stringify(manifest, null, 2) + "\n");
          '
        env:
          TAG: ${{ steps.meta.outputs.tag }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            version.json
